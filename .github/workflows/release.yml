name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix; an existing v tag is required'
        required: true
        type: string

permissions:
  contents: write

env:
  CGO_ENABLED: '0'

jobs:
  windows:
    name: Windows client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Windows client
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "$VERSION" ] || VERSION="${{ github.event.inputs.version }}"
          go run github.com/tc-hib/go-winres@v0.3.3 make --in build/windows/winres.json --arch amd64 --out rsrc --file-version "$VERSION" --product-version "$VERSION"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags production -trimpath -ldflags="-s -w -H windowsgui -X main.version=$VERSION" -o Agent-Link-windows-amd64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Link-windows
          path: Agent-Link-windows-amd64.exe

  macos-arm64:
    name: macOS client (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build macOS app
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "$VERSION" ] || VERSION="${{ github.event.inputs.version }}"
          bash build/macos/release.sh "$VERSION" arm64 "Agent-Link-Apple.Silicon.arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Link-macos-arm64
          path: Agent-Link-Apple.Silicon.arm64.zip

  macos-amd64:
    name: macOS client (Intel)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build macOS app
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "$VERSION" ] || VERSION="${{ github.event.inputs.version }}"
          MACOS_ARCH_FLAGS="-arch x86_64" bash build/macos/release.sh "$VERSION" amd64 "Agent-Link-macOS.Intel.amd64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Link-macos-amd64
          path: Agent-Link-macOS.Intel.amd64.zip

  release:
    name: Publish GitHub Release
    needs: [windows, macos-arm64, macos-amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            REF="$GITHUB_REF_NAME"
          else
            REF="v${{ github.event.inputs.version }}"
          fi
          cat > release-notes.md <<'EOF'
          ## macOS first launch

          These macOS packages use an ad-hoc signature because Agent Link is not enrolled in the paid Apple Developer Program. On first launch, macOS may show “cannot verify the developer”.

          Open the app once with **Control-click → Open → Open**. If macOS still reports the app as damaged, run:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Agent\ Link.app
          ```

          The app bundle is signed and its architecture is verified by the release workflow.
          EOF
          gh release create "$REF" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Agent Link $REF" --notes-file release-notes.md
